<body class="bg-[#FBFBFA] text-[#1E2022] min-h-screen flex items-center justify-center p-4 antialiased selection:bg-[#E07A5F] selection:text-white">

    <div class="absolute -bottom-16 -left-16 w-36 h-36 bg-blue-100 rounded-full blur-2xl pointer-events-none opacity-60"></div>

    <!-- 顶部状态指示图标 -->

    <!-- 主标题与安全认证标识 -->

      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-[11px] font-bold text-emerald-700 mb-3">
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
        </svg>
        <span>已通过安全合规加密审计</span>
      </div>

      <h1 class="text-xl font-black text-neutral-800 tracking-tight" id="statusTitle">
        正在为您安全跳转...
      </h1>

      <p class="text-xs text-neutral-500 mt-2 leading-relaxed" id="statusDesc">
        正在核验节点信誉与优惠权益，请稍候片刻。<br>
        如浏览器未自动响应，请点击下方直达按钮。
      </p>

      <!-- 动态加载指示条 -->
      <div class="w-full bg-neutral-100 rounded-full h-1.5 mt-6 overflow-hidden">
        <div id="progressBar" class="bg-gradient-to-r from-orange-500 to-amber-500 h-1.5 rounded-full transition-all duration-500 ease-out w-1/3"></div>
      </div>

      <!-- 操作直达区 -->
      <div class="mt-7 space-y-3">
        <a id="manualLink" href="#" rel="nofollow sponsored noopener noreferrer" class="w-full py-3 px-4 rounded-xl bg-neutral-900 hover:bg-neutral-800 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-sm transition-all hover:shadow-md cursor-pointer">
          <span id="btnText">立即前往官网 ↗</span>
        </a>

        <a href="/" class="w-full py-2.5 px-4 rounded-xl border border-neutral-200 text-neutral-600 hover:bg-neutral-50 font-medium text-xs flex items-center justify-center gap-1.5 transition-colors">
          <span>← 返回机场便利店首页</span>
        </a>
      </div>

      <!-- 底部安全提示 -->
      <div class="mt-6 pt-5 border-t border-neutral-100 text-[11px] text-neutral-400">
        <p>🔒 采用 301 级安全协议与防拦截通道 · 严选官方正版</p>
      </div>
    </div>
  </div>

  <script>
    // 15 家合规官方直连映射字典
    const REDIRECT_TARGETS = {
      'huanqiuti': 'https://123pps01.huanqiutiaff.com/#/?code=j5VBUvw0',
      'dalaoyun': 'https://ppsvip01.dalaoyunaff.com/#/?code=Iz1GlCVa',
      'liulianyun': 'https://123pp01.liulianyunaff.com/#/?code=MsZP3u7G',
      'yunjiexian': 'https://pp01.yunjiexianaff.com/#/?code=bp0ZSKBV',
      'shandianshu': 'https://ppsvip01.shandianshuaff.com/#/?code=QbLF8tjB',
      'shenxing': 'https://pps123.shenxingaff.com/#/?code=6tQ7zHUc',
      'kexinyun': 'https://everett7623.kosingaff.com/#/?code=sFKkfEYs',
      'kosing': 'https://everett7623.kosingaff.com/#/?code=sFKkfEYs',
      'sujie': 'https://pygllc.speedworldaff.cc/#/?code=kcoensXG',
      'kuaili': 'https://fanxiaobin.kuailiaff.com/#/?code=e0cAmK7F',
      'edgenode': 'https://wep.edgenovaaff.com/#/?code=mLLL6h6F',
      'edgenova': 'https://wep.edgenovaaff.com/#/?code=mLLL6h6F',
      'yuntu': 'https://super.ytjcok.org/#/register?code=poKwFVtv',
      'kunpeng': 'https://kunpengjiasu.com/#/register?code=WPugVZUe',
      'shunyun': 'https://ddd.jichang.best/#/register?code=nldUZaYc',
      'jilianyun': 'https://haozevpn.jlyvipaff.com/#/?code=jwCMOvQO',
      'guangnianti': 'https://gnt001.gntvipaff.cc/#/?code=PQhPFDhO',
      'tg-huanqiuti': 'https://t.me/huanqiuti8899'
    };

    (function() {
      // 提取 id 参数
      const params = new URLSearchParams(window.location.search);
      let targetId = params.get('id');

      // 容错处理：也支持 hash 或 path 后缀
      if (!targetId && window.location.hash) {
        targetId = window.location.hash.replace(/^#\/?/, '').trim();
      }

      const targetUrl = targetId ? REDIRECT_TARGETS[targetId.toLowerCase()] : null;
      const statusTitle = document.getElementById('statusTitle');
      const statusDesc = document.getElementById('statusDesc');
      const manualLink = document.getElementById('manualLink');
      const progressBar = document.getElementById('progressBar');
      const btnText = document.getElementById('btnText');

      if (targetUrl) {
        manualLink.href = targetUrl;
        btnText.textContent = `直达 ${targetId.toUpperCase()} 官方通道 ↗`;
        
        // 进度条动画
        setTimeout(function() {
          if (progressBar) progressBar.style.width = '100%';
        }, 100);

        // 极速安全跳转
        setTimeout(function() {
          try {
            window.location.replace(targetUrl);
          } catch (e) {
            window.location.href = targetUrl;
          }
        }, 350);
      } else {
        if (progressBar) progressBar.style.width = '0%';
        if (statusTitle) statusTitle.textContent = '未找到指定的服务通道';
        if (statusDesc) statusDesc.textContent = '该链接标识可能已更新或不存在，请返回首页选择最新的评测推荐。';
        if (manualLink) {
          manualLink.href = '/reviews.html';
          btnText.textContent = '浏览最新天梯榜单 →';
        }
      }
    })();
  </script>
</body>
</html>
